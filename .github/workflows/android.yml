name: Android app

on:
  push:
    branches:
      - "**"
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
    tags:
      - "app-v*"
  pull_request:
    paths:
      - "app/**"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Pubblica l'APK in una release con questo tag (es. app-v1.0.0); vuoto = solo build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: sign with your own key so each new APK installs over the previous one.
      # Secrets: BCC_KEYSTORE_BASE64, BCC_KEYSTORE_PASSWORD, BCC_KEY_ALIAS, BCC_KEY_PASSWORD
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BCC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bcc.jks"
            echo "BCC_KEYSTORE_PATH=$RUNNER_TEMP/bcc.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key: the APK is signed with a temporary debug key."
          fi

      - name: Build APK
        env:
          BCC_KEYSTORE_PASSWORD: ${{ secrets.BCC_KEYSTORE_PASSWORD }}
          BCC_KEY_ALIAS: ${{ secrets.BCC_KEY_ALIAS }}
          BCC_KEY_PASSWORD: ${{ secrets.BCC_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/LabirintoRicette.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LabirintoRicette-apk
          path: ${{ runner.temp }}/LabirintoRicette.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/app-v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP/LabirintoRicette.apk" --target "$GITHUB_SHA" \
            --title "App Android $TAG" --notes "APK dell'app Android LabirintoRicette." --latest=false
